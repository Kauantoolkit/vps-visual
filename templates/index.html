<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VPS Visual</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>

  <!-- Login screen -->
  <div id="login-screen">
    <div class="login-box">
      <div class="login-title"><span>VPS</span> Visual</div>
      <div class="login-subtitle">Conecte a qualquer servidor via SSH</div>
      <div class="login-form">
        <div class="login-row">
          <div class="login-field" style="flex:3">
            <label>Host / IP</label>
            <input type="text" id="login-host" placeholder="192.168.1.100">
          </div>
          <div class="login-field" style="flex:1">
            <label>Porta</label>
            <input type="number" id="login-port" value="22">
          </div>
        </div>
        <div class="login-field">
          <label>Usuario</label>
          <input type="text" id="login-user" value="root">
        </div>
        <div class="login-field">
          <label>Senha</label>
          <input type="password" id="login-pass" placeholder="senha do servidor"
                 onkeydown="if(event.key==='Enter')doConnect()">
        </div>
        <div id="login-error"></div>
        <button id="login-btn" onclick="doConnect()">Conectar</button>
      </div>
    </div>
  </div>

  <!-- Main app (hidden until connected) -->
  <div id="app" style="display:none">
    <header>
      <h1><span>VPS</span> Visual</h1>
      <span class="connection" id="conn-info">conectado</span>
      <button class="disconnect-btn" onclick="doDisconnect()">desconectar</button>
    </header>

    <div id="command-bar">
      <span class="prompt">$</span>
      <span class="cmd" id="cmd-text">ls -la /root</span>
      <button class="copy-btn" onclick="copyCommand()">copiar</button>
    </div>

    <div id="breadcrumb">
      <span onclick="navigate('/')">/</span>
    </div>

    <main>
      <div id="sidebar">
        <div class="section-title">Navegacao</div>
        <button onclick="goHome()"><span class="icon">&#127968;</span> Home (/root)</button>
        <button onclick="goRoot()"><span class="icon">&#128193;</span> Raiz do sistema (/)</button>
        <button onclick="goVarLog()"><span class="icon">&#128203;</span> Logs do sistema</button>
        <button onclick="goOpt()"><span class="icon">&#128230;</span> Programas (/opt)</button>
        <button onclick="goEtc()"><span class="icon">&#9881;</span> Configuracoes (/etc)</button>

        <div class="section-title">Monitoramento</div>
        <button onclick="showDisk()"><span class="icon">&#128190;</span> Disco / RAM</button>
        <button onclick="showDocker()"><span class="icon">&#128051;</span> Containers Docker</button>
        <button onclick="showServices()"><span class="icon">&#9881;</span> Servicos ativos</button>

        <div class="section-title">Terminal</div>
        <button onclick="toggleTerminal()"><span class="icon">&#62;</span> Terminal (Ctrl+`)</button>
        <button onclick="toggleHistory()"><span class="icon">&#128340;</span> Comandos executados</button>
      </div>

      <div id="file-panel">
        <div id="toolbar">
          <button onclick="navigate(state.path)">&#8635; Atualizar</button>
          <button onclick="createFolder()">&#128193;+ Nova pasta</button>
          <button onclick="createFile()">&#128196;+ Novo arquivo</button>
        </div>
        <div id="file-list">
          <div class="loading">carregando...</div>
        </div>
      </div>

      <div id="preview-panel">
        <div id="preview-header">
          <span class="title"></span>
          <button onclick="closePreview()">&#10005;</button>
        </div>
        <div id="preview-content"></div>
      </div>

      <div id="history-panel">
        <div class="section-title">Comandos executados</div>
        <div id="history-list"></div>
      </div>
    </main>

    <div id="terminal-panel">
      <div id="terminal-output"></div>
      <div id="terminal-input-row">
        <span class="prompt" id="terminal-prompt">root@vps:~$</span>
        <input type="text" id="terminal-input" placeholder="digite um comando..."
               onkeydown="if(event.key==='Enter')terminalExec()">
      </div>
    </div>
  </div>

  <div id="context-menu"></div>

  <script src="/static/app.js"></script>
</body>
</html>
